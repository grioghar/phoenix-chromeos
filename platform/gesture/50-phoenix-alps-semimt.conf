# Phoenix: ALPS GlidePoint touchpads (Dell Latitude/Vostro/Inspiron and others, 2009-2015).
# These are "semi-multitouch" pads: with two fingers down they report only the bounding box of the
# fingers, so the generic ChromeOS settings let the pointer jump when a second finger lands or lifts
# (e.g. at the start/end of a two-finger scroll). Properties are from ChromeOS's gesture library
# (chromiumos/platform/gestures): sensor_jump_filter_interpreter, immediate_interpreter, box_filter.
Section "InputClass"
    Identifier      "Phoenix: ALPS semi-MT touchpad"
    MatchProduct    "AlpsPS/2 ALPS GlidePoint"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/event*"

    # drop sudden position warps instead of moving the pointer
    Option          "Sensor Jump Filter Enable" "1"
    # ignore movement for 0.35 s (default 0.2) after the number of fingers changes
    Option          "Change Timeout" "0.35"
    # small dead box against jitter from the bounding-box reports
    Option          "Box Width" "1.0"
    Option          "Box Height" "1.0"
EndSection
