# Phoenix platform-module catalog.
# One module per line:  module | match | description | default options
# match (all terms must hold):
#   vendor=<regex>    DMI system vendor (case-insensitive); commas separate alternatives: vendor=^HP,^Hewlett
#   model=<regex>     machine model (DMI product name, or product version on Lenovo)
#   !model=<regex>    model must NOT match
#   cpu=Intel|AMD     CPU vendor
#   chassis=<regex>   laptop | desktop | convertible
#   always            every machine
dell-smm-hwmon  | vendor=^Dell                 | Fan speeds, CPU/GPU temperatures and fan control (Dell SMM BIOS)   | ignore_dmi=1
dell-laptop     | vendor=^Dell chassis=laptop  | Keyboard backlight, wireless switch, battery charge thresholds     |
dell-wmi        | vendor=^Dell                 | Hotkeys: brightness, mute, wireless, touchpad toggle               |
thinkpad_acpi   | model=ThinkPad               | ThinkPad hotkeys, fan control, battery thresholds, LEDs            | fan_control=1
ideapad-laptop  | vendor=^LENOVO !model=ThinkPad | IdeaPad hotkeys, camera/Wi-Fi switches, battery conservation mode |
asus-nb-wmi     | vendor=^ASUS                 | ASUS hotkeys, keyboard backlight, fan boost modes                  |
hp-wmi          | vendor=^HP,^Hewlett           | HP hotkeys, wireless switch, sensors                               |
acer-wmi        | vendor=^Acer                 | Acer hotkeys and wireless switch                                   |
samsung-laptop  | vendor=^SAMSUNG              | Samsung keyboard backlight and performance modes                   |
toshiba_acpi    | vendor=^TOSHIBA              | Toshiba hotkeys, keyboard backlight, fan                           |
sony-laptop     | vendor=^Sony                 | Sony VAIO hotkeys and features                                     |
fujitsu-laptop  | vendor=^FUJITSU              | Fujitsu hotkeys and backlight                                      |
msi-laptop      | vendor=^Micro-Star           | MSI laptop features                                                |
applesmc        | vendor=^Apple                | Mac fans, sensors and keyboard backlight                           |
coretemp        | cpu=Intel                    | Intel CPU temperatures (built into the kernel)                     |
k10temp         | cpu=AMD                      | AMD CPU temperatures                                               |
nct6775         | chassis=desktop              | Motherboard sensors and fan control (Nuvoton chips)                |
it87            | chassis=desktop              | Motherboard sensors and fan control (ITE chips)                    | ignore_resource_conflict=1
