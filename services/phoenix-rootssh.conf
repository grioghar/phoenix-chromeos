# Phoenix: local-only root shell for the browser terminal (crosh), where sudo is blocked by the
# "no new privileges" flag. sshd listens on 127.0.0.1:2222 only, key login only, and the key is
# readable only by the chronos user (who already has passwordless sudo in developer mode).
# Set up / removed with: phoenix rootshell on|off
description     "Phoenix local root shell (sshd on 127.0.0.1:2222)"
author          "Phoenix"

start on started system-services
stop on stopping system-services
respawn
respawn limit 5 60

pre-start script
  [ -f /etc/phoenix/ssh/sshd_config ] || { stop; exit 0; }
  mkdir -p /run/sshd /var/empty; chmod 755 /run/sshd
  # phoenix remote: re-open port 2222 for the trusted address after a reboot
  if [ -s /etc/phoenix/remote-on ]; then
    F=$(cat /etc/phoenix/remote-on)
    iptables -C INPUT -p tcp -s "$F" --dport 2222 -j ACCEPT 2>/dev/null || iptables -I INPUT -p tcp -s "$F" --dport 2222 -j ACCEPT
  fi
end script

exec /usr/sbin/sshd -D -e -f /etc/phoenix/ssh/sshd_config
