# Phoenix: periodic maintenance (TRIM, crash cleanup, log cleanup, health reporting)
# Runs at idle, low priority, once per day (see: phoenix platform maintain)
description     "Phoenix maintenance"
author          "Phoenix"

# Start after the system is up and idle for a few minutes
start on started system-services
task

# Run at low priority so it doesn't interfere with foreground tasks
nice 10
oom score 200

# Maintenance loop: run tasks, wait 24 hours, repeat
# The service respawns if it exits, so daily runs are automatic
exec /bin/sh -c 'while :; do /usr/share/phoenix/platform/maintain.sh; sleep 86400; done'
