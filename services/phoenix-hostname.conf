# Phoenix: give the network (DHCP) and the system the hostname chosen at install time.
description     "Phoenix hostname"
author          "Phoenix"

start on started shill
task

script
  N=$(cat /etc/phoenix/hostname 2>/dev/null) || exit 0
  [ -n "$N" ] || exit 0
  i=0
  while [ $i -lt 20 ]; do
    dbus-send --system --dest=org.chromium.flimflam / org.chromium.flimflam.Manager.SetProperty \
      string:DHCPProperty.Hostname variant:string:"$N" && break
    i=$((i + 1)); sleep 1
  done
  hostname "$N" || true
  logger -t phoenix "hostname set to $N"
end script
