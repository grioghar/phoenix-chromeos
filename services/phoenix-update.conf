# Phoenix: keep ChromeOS updates safe on this machine (see platform/update-watch.sh)
description     "Phoenix update watcher"
author          "Phoenix"

start on started system-services
stop on stopping system-services
respawn
respawn limit 5 300

exec /bin/sh -c 'sleep 120; while :; do nice -n 10 /bin/sh /usr/share/phoenix/platform/update-watch.sh; sleep 600; done'
