# Phoenix: undo firmware CPU throttling (dead battery / unrecognised charger) with a thermal guard.
# Setting: throttle_override=on|off, thermal_limit=<C> in /etc/phoenix/platform.conf (phoenix platform throttle)
description     "Phoenix throttle override and thermal guard"
author          "Phoenix"

start on started system-services
stop on stopping system-services
respawn
respawn limit 5 60

exec /bin/sh /usr/share/phoenix/platform/throttle.sh
