# Phoenix health: checks for hardware/system problems every minute and serves them to the
# Phoenix Health extension (green/yellow/red toolbar icon + ChromeOS notifications).
# Before the desktop starts, makes sure Chrome loads the extension (developer-mode chrome_dev.conf).
description     "Phoenix health monitor"
author          "Phoenix"

start on starting ui
stop on stopping ui
respawn
respawn limit 5 60

pre-start script
  F=/etc/chrome_dev.conf; L=--load-extension=/usr/share/phoenix/desktop/extension
  if [ -d /usr/share/phoenix/desktop/extension ] && ! grep -qxF -- "$L" $F 2>/dev/null; then
    mount -o remount,rw / 2>/dev/null; echo "$L" >> $F; sync; mount -o remount,ro / 2>/dev/null || true
  fi
  mkdir -p /run/phoenix
end script

exec /bin/sh /usr/share/phoenix/desktop/health-loop.sh
