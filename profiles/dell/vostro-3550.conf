# Dell Vostro 3550 (2011): i3/i5/i7 Sandy Bridge, Intel HD 3000 (optional Radeon HD 6630M), BIOS only
# Verified with Phoenix on ChromeOS R150 (2026-10-04).
touchpad=alps
kernel_params=i8042.nomux=1 i8042.reset=1
modules=dell-smm-hwmon dell-laptop dell-wmi coretemp
opt_dell_smm_hwmon=ignore_dmi=1
cpu_profile=balanced
fan_mode=bios
notes=ALPS touchpad: native driver gives two-finger scroll; fall back to psmouse.proto=exps if dead
