# Phoenix generic DESKTOP profile: any desktop / all-in-one / tower without a model or motherboard
# profile (whitebox, custom builds, unknown models). Safe defaults for the widest range of desktops:
#  - no extra kernel parameters, no touchpad handling
#  - desktop sensor chips (Nuvoton nct6775, ITE it87) and CPU temperatures from the catalog rules
#  - balanced CPU profile; fans stay under firmware control
# Run `phoenix submit` so the machine (or its motherboard) can get its own profile.
cpu_profile=balanced
fan_mode=bios
notes=Generic desktop profile: no model or motherboard profile yet. CPU, graphics, firmware and sensors are still detected automatically.
