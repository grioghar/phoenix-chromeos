# Phoenix generic profile: used for any machine without a model profile (whitebox, custom builds,
# unknown models). Safe defaults that work on the widest range of hardware:
#  - no extra kernel parameters
#  - platform modules only from catalog rules that need no model match (CPU temperature sensors,
#    desktop sensor chips on desktops); nothing vendor-specific is forced
#  - firmware fan control, balanced CPU profile
# Run `phoenix submit` so the machine can get its own profile.
cpu_profile=balanced
fan_mode=bios
notes=Generic profile: this computer has no model profile yet. Everything Phoenix detects (CPU, graphics, touchpad, firmware) is still handled automatically.
